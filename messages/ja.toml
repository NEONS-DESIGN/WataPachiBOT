[help]
title_1 = "📖 コマンドヘルプ #1 (再生・基本操作)"
title_2 = "📖 コマンドヘルプ #2 (キュー・音量・履歴)"
title_3 = "📖 コマンドヘルプ #3 (BOT管理・設定)"
mention = { text = "助けが必要ですか？\n必要な場合は、`{prefix}help` コマンドを実行してください。", color = "green" }
usage_p = "使い方: `{prefix}p <URL・曲名>`\n例: `{prefix}p https://www.youtube.com/watch?v=dQw4w9WgXcQ`、`{prefix}p 曲名`"
usage_pnow = "使い方: `{prefix}pnow <番号>`\n例: `{prefix}pnow 3` (キューの 3 番目の曲を今すぐ再生します)"
usage_clear = "使い方: `{prefix}clear [開始] [終了]`\n例: `{prefix}clear` (全件)、`{prefix}clear 5` (先頭の 5 件)、`{prefix}clear 3 8` (3 番目から 8 番目)"
usage_vol = "使い方: `{prefix}vol <1-200>`\n例: `{prefix}vol 50`"
usage_setting = "使い方:\n`{prefix}setting admin add <メンバー>` / `{prefix}setting admin remove <メンバー>`\n`{prefix}setting limit queue <値>` / `{prefix}setting limit playlist <値>`\n`{prefix}setting autoleave <秒>`\n`{prefix}setting lang <ja/en>`"

[[help.page_1]]
name = "{prefix}help"
value = "このヘルプ画面を表示します。"

[[help.page_1]]
name = "{prefix}p / {prefix}play [URL・タイトル]"
value = "音楽を再生します（YouTube の動画・プレイリストの URL と、曲名の検索に対応）。"

[[help.page_1]]
name = "{prefix}pause / {prefix}ps"
value = "再生中の曲を一時停止します。"

[[help.page_1]]
name = "{prefix}resume / {prefix}rs"
value = "一時停止中の曲の再生を再開します。"

[[help.page_1]]
name = "{prefix}replay / {prefix}rp"
value = "現在再生中の曲を最初から再生し直します。"

[[help.page_1]]
name = "{prefix}skip / {prefix}s"
