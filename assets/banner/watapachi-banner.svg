<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 480" width="1200" height="480">
	<!--
		WataPachiBOT profile banner (5:2)
		- Same motif and palette as the icon: cotton candy clouds and popping candy on purple
		- The avatar covers the bottom-left corner; that area holds only background and clouds
		- The banner may be cropped to 17:6 (about 28 px off the top and bottom); nothing important sits there
	-->
	<defs>
		<linearGradient id="sky" x1="0" y1="0" x2="0" y2="480" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#2e1065"/>
			<stop offset="0.6" stop-color="#5b21b6"/>
			<stop offset="1" stop-color="#8b45d9"/>
		</linearGradient>
		<radialGradient id="light" cx="780" cy="190" r="520" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#c08cff" stop-opacity="0.55"/>
			<stop offset="1" stop-color="#c08cff" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="cloud" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#fbf4ff"/>
			<stop offset="0.5" stop-color="#e2c4ff"/>
			<stop offset="1" stop-color="#b57af5"/>
		</linearGradient>
		<linearGradient id="bank" x1="0" y1="330" x2="0" y2="480" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#f6e9ff"/>
			<stop offset="0.5" stop-color="#d7b2fc"/>
			<stop offset="1" stop-color="#a868ee"/>
		</linearGradient>
		<linearGradient id="bankBack" x1="0" y1="300" x2="0" y2="480" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#d2a8fb"/>
			<stop offset="1" stop-color="#8e4fe0"/>
		</linearGradient>
		<!-- eighth note; the note head is at (0, 0) -->
		<g id="note" fill="#ffd84d" stroke="#2a0b52" stroke-width="4" stroke-linejoin="round">
			<path d="M10 -64 q26 10 20 44 q-4 -18 -20 -22 Z"/>
			<rect x="4" y="-66" width="9" height="64" rx="2"/>
			<ellipse cx="0" cy="0" rx="16" ry="12" transform="rotate(-20)"/>
		</g>
		<!-- beamed eighth notes; the left note head is at (0, 0) -->
		<g id="notes2" fill="#ffd84d" stroke="#2a0b52" stroke-width="4" stroke-linejoin="round">
			<rect x="7" y="-58" width="9" height="58" rx="2"/>
			<rect x="47" y="-68" width="9" height="58" rx="2"/>
			<polygon points="7,-58 56,-68 56,-52 7,-42"/>
			<ellipse cx="0" cy="0" rx="16" ry="12" transform="rotate(-20)"/>
			<ellipse cx="40" cy="-10" rx="16" ry="12" transform="rotate(-20 40 -10)"/>
		</g>
		<!-- 4-point sparkle of radius 1; scale it with transform -->
		<path id="spark" d="M0 -1 Q0 0 1 0 Q0 0 0 1 Q0 0 -1 0 Q0 0 0 -1 Z"/>
	</defs>

	<!-- sky -->
	<rect width="1200" height="480" fill="url(#sky)"/>
	<rect width="1200" height="480" fill="url(#light)"/>
	<g fill="#ffffff">
		<circle cx="60" cy="60" r="2.5" opacity="0.5"/>
		<circle cx="250" cy="40" r="2" opacity="0.4"/>
		<circle cx="360" cy="190" r="2.5" opacity="0.35"/>
		<circle cx="610" cy="60" r="2" opacity="0.45"/>
		<circle cx="690" cy="260" r="2.5" opacity="0.35"/>
		<circle cx="960" cy="50" r="3" opacity="0.5"/>
		<circle cx="1150" cy="70" r="2" opacity="0.4"/>
		<circle cx="1120" cy="330" r="2.5" opacity="0.35"/>
		<circle cx="120" cy="200" r="2" opacity="0.35"/>
		<circle cx="470" cy="300" r="2" opacity="0.3"/>
	</g>

	<!-- back cloud bank -->
	<g fill="#2a0b52" stroke="#2a0b52" stroke-width="14">
		<circle cx="470" cy="440" r="80"/>
		<circle cx="700" cy="400" r="86"/>
		<circle cx="980" cy="388" r="92"/>
		<circle cx="1160" cy="400" r="82"/>
	</g>
	<g fill="url(#bankBack)">
		<circle cx="470" cy="440" r="80"/>
		<circle cx="700" cy="400" r="86"/>
		<circle cx="980" cy="388" r="92"/>
		<circle cx="1160" cy="400" r="82"/>
	</g>

	<!-- front cloud bank (lower on the left, where the avatar sits) -->
	<g fill="#2a0b52" stroke="#2a0b52" stroke-width="14">
		<circle cx="-20" cy="505" r="90"/>
		<circle cx="120" cy="520" r="80"/>
		<circle cx="250" cy="510" r="85"/>
		<circle cx="385" cy="488" r="92"/>
		<circle cx="525" cy="476" r="90"/>
		<circle cx="655" cy="462" r="96"/>
		<circle cx="795" cy="470" r="92"/>
		<circle cx="925" cy="452" r="100"/>
		<circle cx="1065" cy="466" r="96"/>
		<circle cx="1195" cy="456" r="92"/>
	</g>
	<g fill="url(#bank)">
		<circle cx="-20" cy="505" r="90"/>
		<circle cx="120" cy="520" r="80"/>
		<circle cx="250" cy="510" r="85"/>
		<circle cx="385" cy="488" r="92"/>
		<circle cx="525" cy="476" r="90"/>
		<circle cx="655" cy="462" r="96"/>
		<circle cx="795" cy="470" r="92"/>
		<circle cx="925" cy="452" r="100"/>
		<circle cx="1065" cy="466" r="96"/>
		<circle cx="1195" cy="456" r="92"/>
	</g>
	<g fill="#ffffff">
		<ellipse cx="370" cy="418" rx="24" ry="10" transform="rotate(-18 370 418)" opacity="0.7"/>
		<ellipse cx="640" cy="388" rx="28" ry="11" transform="rotate(-15 640 388)" opacity="0.75"/>
		<ellipse cx="905" cy="374" rx="30" ry="12" transform="rotate(-15 905 374)" opacity="0.75"/>
		<ellipse cx="1170" cy="384" rx="22" ry="9" transform="rotate(-15 1170 384)" opacity="0.65"/>
	</g>

	<!-- floating clouds -->
	<g transform="translate(780 170)">
		<g fill="#2a0b52" stroke="#2a0b52" stroke-width="12">
			<circle cx="0" cy="-20" r="52"/>
			<circle cx="-50" cy="8" r="40"/>
			<circle cx="50" cy="8" r="40"/>
			<circle cx="-20" cy="26" r="38"/>
			<circle cx="22" cy="26" r="38"/>
		</g>
		<g fill="url(#cloud)">
			<circle cx="0" cy="-20" r="52"/>
			<circle cx="-50" cy="8" r="40"/>
			<circle cx="50" cy="8" r="40"/>
			<circle cx="-20" cy="26" r="38"/>
			<circle cx="22" cy="26" r="38"/>
		</g>
		<ellipse cx="-20" cy="-48" rx="18" ry="9" transform="rotate(-25 -20 -48)" fill="#ffffff" opacity="0.85"/>
		<g stroke="#2a0b52" stroke-width="3" stroke-linejoin="round">
			<polygon points="-34,0 -20,-6 -15,8 -29,13" fill="#ff5fc8"/>
			<polygon points="10,-30 23,-26 20,-13 7,-17" fill="#ffd84d"/>
			<polygon points="20,18 34,14 37,28 23,32" fill="#5ee7ff"/>
			<polygon points="-62,14 -50,10 -47,22 -59,25" fill="#ffd84d"/>
		</g>
	</g>
	<g transform="translate(1065 118)">
		<g fill="#2a0b52" stroke="#2a0b52" stroke-width="10">
			<circle cx="0" cy="-10" r="34"/>
			<circle cx="-32" cy="10" r="26"/>
			<circle cx="32" cy="10" r="26"/>
			<circle cx="0" cy="16" r="28"/>
		</g>
		<g fill="url(#cloud)">
			<circle cx="0" cy="-10" r="34"/>
			<circle cx="-32" cy="10" r="26"/>
			<circle cx="32" cy="10" r="26"/>
			<circle cx="0" cy="16" r="28"/>
		</g>
		<ellipse cx="-12" cy="-30" rx="12" ry="6" transform="rotate(-25 -12 -30)" fill="#ffffff" opacity="0.85"/>
		<g stroke="#2a0b52" stroke-width="3" stroke-linejoin="round">
			<polygon points="-10,2 2,-2 5,10 -7,13" fill="#5ee7ff"/>
			<polygon points="18,-14 29,-12 28,-1 17,-3" fill="#ff5fc8"/>
		</g>
	</g>
	<g transform="translate(430 118)">
		<g fill="#2a0b52" stroke="#2a0b52" stroke-width="10">
			<circle cx="0" cy="-8" r="30"/>
			<circle cx="-28" cy="10" r="22"/>
			<circle cx="28" cy="10" r="22"/>
			<circle cx="0" cy="14" r="24"/>
		</g>
		<g fill="url(#cloud)">
			<circle cx="0" cy="-8" r="30"/>
			<circle cx="-28" cy="10" r="22"/>
			<circle cx="28" cy="10" r="22"/>
			<circle cx="0" cy="14" r="24"/>
		</g>
		<ellipse cx="-10" cy="-26" rx="10" ry="5" transform="rotate(-25 -10 -26)" fill="#ffffff" opacity="0.85"/>
		<polygon points="2,0 13,-3 15,8 4,11" fill="#ffd84d" stroke="#2a0b52" stroke-width="3" stroke-linejoin="round"/>
	</g>

	<!-- popping candy crystals: on the cloud bank -->
	<g stroke="#2a0b52" stroke-width="3" stroke-linejoin="round">
		<polygon points="420,430 436,424 441,440 425,445" fill="#ff5fc8"/>
		<polygon points="560,410 574,406 577,420 563,424" fill="#5ee7ff"/>
		<polygon points="700,420 716,416 718,432 702,435" fill="#ffd84d"/>
		<polygon points="850,402 864,396 869,410 855,416" fill="#ff5fc8"/>
		<polygon points="980,420 996,418 997,434 981,436" fill="#5ee7ff"/>
		<polygon points="1110,410 1124,404 1129,418 1115,424" fill="#ffd84d"/>
		<polygon points="760,448 772,446 774,458 762,460" fill="#ff5fc8"/>
		<polygon points="1020,380 1032,376 1035,388 1023,391" fill="#ffd84d"/>
	</g>
	<!-- popping candy crystals: flying -->
	<g stroke="#2a0b52" stroke-width="3" stroke-linejoin="round">
		<polygon points="300,96 314,90 319,104 305,110" fill="#5ee7ff"/>
		<polygon points="560,170 574,166 577,180 563,184" fill="#ff5fc8"/>
		<polygon points="660,90 672,86 676,98 664,102" fill="#ffd84d"/>
		<polygon points="900,150 914,146 917,160 903,164" fill="#5ee7ff"/>
		<polygon points="1160,200 1174,196 1177,210 1163,214" fill="#ff5fc8"/>
		<polygon points="1000,300 1012,296 1015,308 1003,311" fill="#ffd84d"/>
		<polygon points="140,140 152,136 155,148 143,151" fill="#ffd84d"/>
		<polygon points="480,250 492,246 495,258 483,261" fill="#5ee7ff"/>
	</g>

	<!-- pachi pachi bursts -->
	<g fill="none" stroke-width="6" stroke-linecap="round">
		<g stroke="#ffd84d">
			<line x1="548" y1="74" x2="566" y2="62"/>
			<line x1="552" y1="94" x2="574" y2="96"/>
			<line x1="540" y1="56" x2="546" y2="38"/>
		</g>
		<g stroke="#ff7ad6">
			<line x1="852" y1="138" x2="872" y2="128"/>
			<line x1="856" y1="158" x2="878" y2="162"/>
		</g>
		<g stroke="#7cf0ff">
			<line x1="208" y1="74" x2="190" y2="60"/>
			<line x1="204" y1="96" x2="182" y2="100"/>
			<line x1="218" y1="58" x2="212" y2="40"/>
		</g>
		<g stroke="#ffd84d">
			<line x1="1132" y1="290" x2="1150" y2="278"/>
			<line x1="1136" y1="310" x2="1158" y2="312"/>
		</g>
	</g>

	<!-- sparkles -->
	<g stroke="#2a0b52" stroke-linejoin="round">
		<use xlink:href="#spark" href="#spark" transform="translate(520 84) scale(26)" fill="#ffd84d" stroke-width="0.12"/>
		<use xlink:href="#spark" href="#spark" transform="translate(236 84) scale(22)" fill="#7cf0ff" stroke-width="0.14"/>
		<use xlink:href="#spark" href="#spark" transform="translate(640 300) scale(18)" fill="#ff8ae0" stroke-width="0.17"/>
		<use xlink:href="#spark" href="#spark" transform="translate(880 70) scale(14)" fill="#ffffff" stroke-width="0.21"/>
		<use xlink:href="#spark" href="#spark" transform="translate(320 220) scale(16)" fill="#ff8ae0" stroke-width="0.19"/>
		<use xlink:href="#spark" href="#spark" transform="translate(1110 280) scale(20)" fill="#ffd84d" stroke-width="0.15"/>
		<use xlink:href="#spark" href="#spark" transform="translate(70 120) scale(12)" fill="#ffffff" stroke-width="0.25"/>
		<use xlink:href="#spark" href="#spark" transform="translate(1170 40) scale(12)" fill="#7cf0ff" stroke-width="0.25"/>
	</g>

	<!-- music notes -->
	<use xlink:href="#note" href="#note" transform="translate(595 262) rotate(-10)"/>
	<use xlink:href="#notes2" href="#notes2" transform="translate(905 290) rotate(-6)"/>
	<use xlink:href="#note" href="#note" transform="translate(1150 160) rotate(12) scale(0.8)"/>
	<use xlink:href="#note" href="#note" transform="translate(370 300) rotate(8) scale(0.85)"/>
</svg>
